<style>
:root{
  --ink:#2A1854;--purple:#423066;--coral:#EA546C;--cream:#FBF7F2;
  --text:#463F58;--muted:#5B5468;--line:#E6DEEE;
  --ok:#0B8A55;--ok-bg:#E4F3EC;--no:#B92F47;--no-bg:#FBE7EB;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,sans-serif;color:var(--text);
  background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
h1{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:var(--ink)}
p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* Superfícies que o navegador desenha por conta própria e entregam o padrão
   dele se a gente não pintar: seleção, cursor de texto, anel de foco. */
::selection{background:var(--coral);color:#fff}
:focus-visible{outline:2.5px solid var(--purple);outline-offset:3px;border-radius:8px}
:root{caret-color:var(--coral);accent-color:var(--coral)}

/* ===== PRIMEIRA DOBRA: headline e vídeo na MESMA tela =====
   O vídeo é 4:5, ou seja, a altura dele é 1,25x a largura. Para o conjunto
   fechar em uma dobra quem cede é a LARGURA do vídeo: ela nunca passa do que
   sobra de altura depois do texto. --reserve é essa sobra, medida no
   navegador por faixa de tela, não chutada. */
.hero{min-height:100svh;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(88% 58% at 50% -6%, #F1E9FA 0%, rgba(241,233,250,0) 70%),
    var(--cream)}
.wrap{width:100%;max-width:900px;margin:0 auto;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1.1rem,3vh,1.9rem);text-align:center;
  padding:clamp(1rem,3.5vh,2rem) clamp(1.15rem,5vw,1.5rem)}

.claim{display:flex;flex-direction:column;align-items:center;gap:clamp(.7rem,1.9vh,1.05rem)}

h1{font-size:clamp(1.62rem,6.6vw,3rem);font-weight:900;line-height:1.06;
  letter-spacing:-.022em;text-wrap:balance}
h1 .num{color:var(--coral)}
.claim-top{display:inline-flex;align-items:center;justify-content:center;gap:.4em}

/* Ícones desenhados, mesma família e mesma espessura de traço. Emoji não
   entra: sai com cor, tamanho e alinhamento diferentes em cada sistema. */
.ic{flex:0 0 auto;border-radius:50%;display:grid;place-items:center}
.ic svg{fill:none;stroke:currentColor;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}
.ic--ok{width:1.02em;height:1.02em;background:var(--ok-bg);color:var(--ok)}
.ic--ok svg{width:.55em;height:.55em;stroke-width:3.4}
.ic--no{width:1.35em;height:1.35em;background:var(--no-bg);color:var(--no)}
.ic--no svg{width:.72em;height:.72em}

/* As duas objeções. Linhas com fio separador em vez de cartões: o cartão
   pediria a mesma atenção da promessa, e a promessa é que manda aqui. */
.drops{display:flex;flex-direction:column;align-items:stretch;
  font-size:clamp(.9rem,3.5vw,1.06rem);color:var(--purple);font-weight:500}
.drops li{display:flex;align-items:center;gap:.6rem;padding:.42rem .1rem;text-align:left}
.drops li + li{border-top:1px solid var(--line)}

.kicker{display:inline-flex;align-items:center;gap:.5rem;
  font-family:'Montserrat',system-ui,sans-serif;font-weight:800;color:var(--ink);
  font-size:clamp(1rem,3.8vw,1.2rem);letter-spacing:-.01em}
.kicker svg{width:1.15em;height:1.15em;fill:none;stroke:var(--coral);stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;animation:nudge 2.6s cubic-bezier(.22,1,.36,1) 1.2s infinite}
@keyframes nudge{0%,62%,100%{transform:translateY(0)}74%{transform:translateY(5px)}86%{transform:translateY(1px)}}

.sub{color:var(--muted);font-size:clamp(.86rem,3.1vw,1rem);line-height:1.4;max-width:28em}

/* Player. A largura é limitada pela altura livre: (100svh - reserve) * 0,8 é
   a maior largura cuja altura 4:5 ainda cabe no que sobrou. */
.hero{--reserve:326px}
@media (min-width:480px){.hero{--reserve:344px}}
@media (min-width:768px){.hero{--reserve:372px}}
/* Celular antigo e baixo (320x568 e afins): o vídeo ficaria do tamanho de um
   selo. A qualificação sai da dobra para o vídeo voltar a ter presença. */
@media (max-width:520px) and (max-height:640px){
  .hero{--reserve:250px}
  .sub{display:none}
}
.video{width:min(100%,400px,calc((100svh - var(--reserve)) * .8));
  margin-inline:auto;border-radius:20px;overflow:hidden;background:#0B0713;
  box-shadow:0 2px 4px rgba(0,0,0,.09),0 22px 48px -12px rgba(0,0,0,.26)}
.video vturb-smartplayer{display:block;width:100%!important;max-width:none!important}

/* Uma entrada só, a da dobra inteira, saindo de um estado já legível. */
@media (prefers-reduced-motion:no-preference){
  .claim,.video{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
  .video{animation-delay:.09s}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.kicker svg{animation:none}}

/* Tela larga e baixa (celular deitado, notebook curto): texto ao lado do
   vídeo, senão a coluna única não fecha em uma dobra. */
@media (min-width:900px) and (max-height:830px){
  .wrap{flex-direction:row;align-items:center;justify-content:center;
    gap:clamp(1.75rem,4.5vw,3.25rem);text-align:left;max-width:1080px}
  .claim{align-items:flex-start;max-width:31rem}
  .claim-top{justify-content:flex-start}
  .kicker svg{transform:rotate(-90deg);animation-name:nudge-x}
  @keyframes nudge-x{0%,62%,100%{transform:rotate(-90deg) translateY(0)}74%{transform:rotate(-90deg) translateY(5px)}86%{transform:rotate(-90deg) translateY(1px)}}
  .video{width:min(400px,calc((100svh - 4rem) * .8));flex:0 0 auto}
  .sub{max-width:24em}
}
</style>
</head>
<body>

<main class="hero">
  <div class="wrap">

    <div class="claim">
      <h1>
        <span class="claim-top">
          <span class="ic ic--ok" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4.5 12.4l5 5L19.5 7"/></svg>
          </span>
          <span><span class="num">20 minutinhos</span> por dia</span>
        </span>
      </h1>

      <ul class="drops">
        <li>
          <span class="ic ic--no" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </span>
          Não precisa levar jeito pra música
        </li>
        <li>
          <span class="ic ic--no" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </span>
          Não importa a sua idade
        </li>
      </ul>

      <p class="kicker">
        No vídeo eu explico
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v14.5M5.5 12.5L12 19l6.5-6.5"/></svg>
      </p>

      <p class="sub">É para todos que querem aprender a tocar um instrumento musical.</p>
    </div>

    <div class="video">
<vturb-smartplayer id="vid-6a982022f2db3546747cca7d" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 125% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer> <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/8684569c-af6a-4351-94a5-45eb00e4ba43/players/6a982022f2db3546747cca7d/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
    </div>

  </div>
</main>

</body>
