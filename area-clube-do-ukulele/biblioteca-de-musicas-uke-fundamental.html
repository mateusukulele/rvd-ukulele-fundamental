<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Músicas do Ukulele Fundamental</title>
<meta name="description" content="As músicas da Biblioteca de Músicas que vem com o curso Ukulele Fundamental, do Clube do Ukulele.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --indigo: #443468;
    --texto: #1F1A2B;
    --texto-suave: #5C5A70;
    --fundo: #F5F4F7;
    --cartao: #FFFFFF;
    --borda: #8E8AA3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    padding: 32px 16px 48px;
  }

  .wrap { max-width: 700px; margin: 0 auto; }

  .logo { display: block; width: 160px; height: auto; margin-bottom: 28px; }

  h1 {
    font-family: "Anton", "Montserrat", sans-serif;
    font-weight: 400;
    color: var(--indigo);
    font-size: clamp(32px, 7vw, 44px);
    line-height: 1.12;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
  }

  .sub { color: var(--texto); margin-bottom: 8px; }
  .contagem { color: var(--texto-suave); font-size: 15px; margin-bottom: 20px; }

  .busca {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--fundo);
    padding: 8px 0 12px;
  }
  .busca input {
    width: 100%;
    font: inherit;
    padding: 12px 16px;
    min-height: 48px;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: var(--cartao);
    color: var(--texto);
  }
  .busca input::placeholder { color: var(--texto-suave); }
  .busca input:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  ul.lista { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  ul.lista li {
    background: var(--cartao);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .musica { font-weight: 700; color: var(--texto); line-height: 1.35; }
  .artista { color: var(--texto-suave); font-size: 15px; line-height: 1.4; }

  .estado { color: var(--texto-suave); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="/img/logo/logo-horizontal.svg" alt="Clube do Ukulele" width="160" height="53">

  <h1>Músicas do Ukulele Fundamental</h1>
  <p class="sub">Estas são as músicas da Biblioteca de Músicas que vem com o curso Ukulele Fundamental. Quem entra no curso tem acesso a todas elas por 1 ano.</p>
  <p class="contagem" id="contagem" aria-live="polite"></p>

  <div class="busca">
    <label class="sr-only" for="busca">Procure por música ou artista</label>
    <input id="busca" type="search" placeholder="Procure por música ou artista" autocomplete="off">
  </div>

  <ul class="lista" id="lista"></ul>
  <p class="estado" id="estado">Carregando as músicas...</p>
</main>

<script>
var WORKER_URL = "https://biblioteca-de-musicas-lista-geral.mateusaugusto91.workers.dev";
/* só os níveis que o aluno do Ukulele Fundamental acessa */
var NIVEIS_FUNDAMENTAL = ["Iniciante 0", "Iniciante 1"];
var musicas = [];

function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function render() {
  var q = norm(document.getElementById("busca").value);
  var itens = q ? musicas.filter(function (m) { return norm(m.artista + " " + m.musica).indexOf(q) !== -1; }) : musicas;
  document.getElementById("lista").innerHTML = itens.map(function (m) {
    return '<li><div class="musica">' + escapeHtml(m.musica) + '</div>' +
      (m.artista ? '<div class="artista">' + escapeHtml(m.artista) + '</div>' : '') + '</li>';
  }).join("");
  var estado = document.getElementById("estado");
  estado.textContent = itens.length ? "" : "Nenhuma música encontrada com esse nome.";
  estado.style.display = itens.length ? "none" : "block";
}

fetch(WORKER_URL)
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function (dados) {
    var vistas = {};
    musicas = dados.filter(function (m) {
      if (NIVEIS_FUNDAMENTAL.indexOf(m.nivel) === -1) return false;
      var chave = norm(m.artista) + "|" + norm(m.musica); // a mesma música em duas versões aparece uma vez
      if (vistas[chave]) return false;
      vistas[chave] = true;
      return true;
    });
    document.getElementById("contagem").textContent = musicas.length + " músicas";
    render();
  })
  .catch(function () {
    document.getElementById("estado").textContent = "Não foi possível carregar a lista. Tente recarregar a página.";
  });

document.getElementById("busca").addEventListener("input", render);
</script>
</body>
</html>
