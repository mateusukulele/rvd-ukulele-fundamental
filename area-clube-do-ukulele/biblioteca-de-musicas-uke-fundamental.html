<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Músicas do Ukulele Fundamental</title>
<meta name="description" content="As músicas da Biblioteca de Músicas que vem com o curso Ukulele Fundamental, do Clube do Ukulele.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --indigo: #443468;
    --indigo-profundo: #2D124E;
    --coral: #E87A85;          /* só sobre o índigo profundo */
    --coral-forte: #B4404F;    /* número sobre o cartão branco */
    --coral-suave: #FBEAEC;
    --coral-texto: #4D1A20;
    --texto: #1F1A2B;
    --texto-suave: #5C5A70;
    --texto-escuro-sec: #DCD6E6;
    --fundo: #F5F4F7;
    --cartao: #FFFFFF;
    --borda: #8E8AA3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
  }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  /* ---------- topo ---------- */
  .topo { background: var(--indigo-profundo); color: #FFFFFF; padding: 28px 0 32px; }
  .logo { display: block; width: 140px; height: auto; margin-bottom: 24px; }
  h1 {
    font-family: "Anton", "Montserrat", sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 8vw, 52px);
    line-height: 1.12;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
  }
  .sub { color: var(--texto-escuro-sec); max-width: 640px; }
  .numeros { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 20px; }
  .numeros div { color: var(--texto-escuro-sec); font-size: 15px; }
  .numeros strong {
    display: block;
    color: var(--coral);
    font-family: "Anton", "Montserrat", sans-serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.12;
  }

  /* ---------- busca ---------- */
  .busca { position: sticky; top: 0; z-index: 2; background: var(--fundo); padding: 16px 0 12px; }
  .busca input {
    width: 100%;
    font: inherit;
    min-height: 48px;
    padding: 10px 16px;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: var(--cartao);
    color: var(--texto);
  }
  .busca input::placeholder { color: var(--texto-suave); }
  .busca input:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ---------- lista por estilo ---------- */
  .estilo { margin-top: 20px; }
  .estilo h2 {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    background: var(--coral-suave);
    color: var(--coral-texto);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    padding: 10px 16px;
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .estilo h2 span { font-weight: 500; font-size: 14px; }

  ol.grade {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }
  @media (min-width: 640px) { ol.grade { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 920px) { ol.grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  ol.grade li {
    background: var(--cartao);
    border-radius: 10px;
    padding: 8px 12px 10px;
    min-width: 0;
  }
  .num {
    display: block;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 500;
    font-size: 13px;
    line-height: 1.4;
    color: var(--coral-forte);
  }
  .musica { display: block; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .artista { display: block; color: var(--texto-suave); font-size: 14px; line-height: 1.35; margin-top: 2px; overflow-wrap: anywhere; }

  .estado { color: var(--texto-suave); text-align: center; padding: 32px 0; }
  .rodape { color: var(--texto-suave); font-size: 14px; text-align: center; padding: 32px 0 40px; }
</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <img class="logo" src="/img/logo/logo-horizontal-branca.svg" alt="Clube do Ukulele" width="140" height="47">
    <h1>Músicas do Ukulele Fundamental</h1>
    <p class="sub">Estas são as músicas da Biblioteca de Músicas que vem com o curso Ukulele Fundamental. Quem entra no curso tem acesso a todas elas por 1 ano.</p>
    <div class="numeros" aria-live="polite">
      <div><strong id="n-musicas">&nbsp;</strong>músicas</div>
      <div><strong id="n-estilos">&nbsp;</strong>estilos</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="busca">
    <label class="sr-only" for="busca">Procure por música ou artista</label>
    <input id="busca" type="search" placeholder="Procure por música ou artista" autocomplete="off">
  </div>

  <div id="lista"></div>
  <p class="estado" id="estado">Carregando as músicas...</p>
  <p class="rodape">Clube do Ukulele, a escola do professor Mateus Augusto</p>
</main>

<script>
var WORKER_URL = "https://biblioteca-de-musicas-lista-geral.mateusaugusto91.workers.dev";
/* só os níveis que o aluno do Ukulele Fundamental acessa */
var NIVEIS_FUNDAMENTAL = ["Iniciante 0", "Iniciante 1"];
var grupos = []; // [{ estilo, musicas: [{ n, musica, artista }] }]

function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function montar(dados) {
  var vistas = {}, porEstilo = {};
  dados.forEach(function (m) {
    if (NIVEIS_FUNDAMENTAL.indexOf(m.nivel) === -1) return;
    var nome = String(m.musica || "").replace(/\s+v\d+$/i, ""); // "Let it be v1" e "v2" viram uma só
    var chave = norm(m.artista) + "|" + norm(nome); // a mesma música em duas versões aparece uma vez
    if (vistas[chave]) return;
    vistas[chave] = true;
    var estilo = (m.genero || "").trim() || "Outros estilos";
    (porEstilo[estilo] = porEstilo[estilo] || []).push({ musica: nome, artista: m.artista });
  });
  // estilo com mais músicas primeiro; dentro dele, ordem alfabética da música
  grupos = Object.keys(porEstilo).map(function (e) {
    var lista = porEstilo[e].sort(function (a, b) { return norm(a.musica).localeCompare(norm(b.musica)); });
    return { estilo: e, musicas: lista };
  }).sort(function (a, b) {
    if (a.estilo === "Outros estilos") return 1;
    if (b.estilo === "Outros estilos") return -1;
    return b.musicas.length - a.musicas.length || a.estilo.localeCompare(b.estilo);
  });
  var n = 0;
  grupos.forEach(function (g) { g.musicas.forEach(function (m) { m.n = ++n; }); });
  document.getElementById("n-musicas").textContent = n;
  document.getElementById("n-estilos").textContent = grupos.length;
}

function render() {
  var q = norm(document.getElementById("busca").value);
  var total = 0;
  var html = grupos.map(function (g) {
    var itens = q ? g.musicas.filter(function (m) { return norm(m.musica + " " + m.artista).indexOf(q) !== -1; }) : g.musicas;
    if (!itens.length) return "";
    total += itens.length;
    return '<section class="estilo"><h2>' + escapeHtml(g.estilo) +
      '<span>' + itens.length + (itens.length === 1 ? " música" : " músicas") + '</span></h2>' +
      '<ol class="grade">' + itens.map(function (m) {
        return '<li><span class="num">' + m.n + '</span><span class="musica">' + escapeHtml(m.musica) + '</span>' +
          (m.artista ? '<span class="artista">' + escapeHtml(m.artista) + '</span>' : '') + '</li>';
      }).join("") + '</ol></section>';
  }).join("");
  document.getElementById("lista").innerHTML = html;
  var estado = document.getElementById("estado");
  estado.textContent = total ? "" : "Nenhuma música encontrada com esse nome.";
  estado.style.display = total ? "none" : "block";
}

fetch(WORKER_URL)
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function (dados) { montar(dados); render(); })
  .catch(function () {
    document.getElementById("estado").textContent = "Não foi possível carregar a lista. Tente recarregar a página.";
  });

document.getElementById("busca").addEventListener("input", render);
</script>
</body>
</html>
