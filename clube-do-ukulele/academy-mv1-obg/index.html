<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Cadastro recebido · Clube do Ukulele</title>
<meta name="description" content="Seu pré-cadastro no Clube do Ukulele foi recebido. Dê o play no vídeo e fale com a nossa equipe no WhatsApp.">
<link rel="icon" type="image/svg+xml" href="../../img/favicon-mini-ukulele.svg">
<link rel="alternate icon" type="image/webp" href="../../favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="../../academy/img/obrigado-poster.webp">
<style>
:root{
  --indigo:#443468;--indigo-profundo:#2D124E;--quase-preto:#1A0E2E;
  --coral:#E87A85;--texto:#1F1A2E;--wa:#128C7E;--wa-escuro:#075E54;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--indigo-profundo);color:var(--texto);font-family:"Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100vh;padding:28px 16px 48px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url(../../academy/img/hero-bg-2026.webp) center top/cover no-repeat;z-index:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(26 14 46 / .55) 0%,rgb(26 14 46 / .25) 45%,rgb(26 14 46 / .6) 100%);z-index:0}
.hero>*{position:relative;z-index:1}
.logo{width:120px;height:auto;display:block;margin:0 auto 22px}
h1{font-family:"Anton",Impact,sans-serif;font-weight:400;color:#fff;text-transform:uppercase;text-align:center;
   font-size:clamp(30px,5.2vw,58px);line-height:1.14;letter-spacing:.3px;margin:0 auto 28px;max-width:980px;text-wrap:balance;
   text-shadow:0 2px 6px rgb(0 0 0 / .35)}
h1 em{font-style:normal;color:var(--coral)}
.card{width:100%;max-width:720px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 30px 60px -28px rgb(10 4 20 / .75)}
.player{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--quase-preto)}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:0;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.play img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play span{position:relative;width:84px;height:84px;border-radius:999px;background:var(--coral);display:grid;place-items:center;
   box-shadow:0 8px 20px -8px rgb(0 0 0 / .45);transition:transform .2s ease}
.play:hover span,.play:focus-visible span{transform:scale(1.07)}
.play svg{width:36px;height:36px;margin-left:5px;fill:var(--quase-preto)}
.play:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.contato{padding:22px 10px 8px;text-align:center}
.contato p{font-size:clamp(17px,2.2vw,20px);line-height:1.5;font-weight:700;margin:0 auto 20px;max-width:560px;text-wrap:pretty}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:14px 30px;border-radius:999px;
   background:var(--wa);color:#fff;font-weight:700;font-size:19px;text-decoration:none;box-shadow:0 8px 18px -10px rgb(0 0 0 / .35);transition:background .2s ease,transform .2s ease}
.btn-wa:hover{background:var(--wa-escuro);transform:translateY(-1px)}
.btn-wa:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.btn-wa svg{width:28px;height:28px;flex:none;fill:#fff}
.rodape{margin-top:auto;padding-top:32px;color:#D9D2EC;font-size:13px;text-align:center}
@media (max-width:520px){
  .hero{padding-top:22px}
  .logo{width:100px;margin-bottom:18px}
  .card{padding:10px;border-radius:18px}
  .play span{width:68px;height:68px}.play svg{width:30px;height:30px}
  .btn-wa{width:100%;padding:14px 14px;gap:10px;font-size:16px}
  .btn-wa svg{width:24px;height:24px}
}
@media (prefers-reduced-motion:reduce){.play span,.btn-wa{transition:none}}
</style>
</head>
<body>
<main class="hero">
  <img class="logo" src="../../img/logo-clube-do-ukulele.webp" alt="Clube do Ukulele" width="1190" height="778">
  <h1>Dê o play no vídeo e entenda como escolher o <em>seu plano</em> no Clube do Ukulele</h1>

  <div class="card">
    <div class="player" id="player">
      <button class="play" type="button" id="play" aria-label="Assistir ao vídeo do Mateus">
        <img src="../../academy/img/obrigado-poster.webp" alt="" width="1280" height="720">
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </button>
    </div>

    <div class="contato">
      <p>Se quiser, pode já entrar em contato com nossa equipe apertando o botão verde aqui, que vai te levar direto pro nosso WhatsApp oficial!</p>
      <a class="btn-wa" id="btn-wa" href="https://wa.me/5531998585286" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.5h-.01a9.45 9.45 0 0 1-4.81-1.32l-.35-.2-3.58.94.96-3.49-.23-.36a9.43 9.43 0 0 1-1.45-5.03c0-5.22 4.25-9.47 9.48-9.47 2.53 0 4.9.99 6.7 2.78a9.4 9.4 0 0 1 2.77 6.7c0 5.22-4.25 9.46-9.48 9.46zm8.06-17.53A11.33 11.33 0 0 0 12.05.63C5.77.63.66 5.74.66 12.02c0 2 .52 3.96 1.52 5.69L.57 23.63l6.05-1.59a11.36 11.36 0 0 0 5.43 1.38h.01c6.28 0 11.39-5.11 11.39-11.39 0-3.04-1.18-5.9-3.34-8.05z"/></svg>
        Falar com a equipe no WhatsApp
      </a>
    </div>
  </div>

  <p class="rodape">Clube do Ukulele · comotocarukulele.com</p>
</main>

<script>
(function(){
  var msg = 'Oi! Acabei de fazer o pré-cadastro para receber informações sobre os planos do Clube do Ukulele Academy.';
  document.getElementById('btn-wa').href = 'https://wa.me/5531998585286?text=' + encodeURIComponent(msg);
  // O vídeo só é criado no clique: a página abre leve e o som começa porque foi a pessoa que apertou.
  var botao = document.getElementById('play');
  botao.addEventListener('click', function(){
    var v = document.createElement('video');
    v.src = '../../academy/video/obrigado-academy.mp4';
    v.poster = '../../academy/img/obrigado-poster.webp';
    v.controls = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('playsinline', '');
    document.getElementById('player').replaceChild(v, botao);
    v.play();
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({event: 'obrigado_video_play'});
  });
})();
</script>

<script>

if(document.readyState!=='loading'){setTimeout(g,1500);}else{document.addEventListener('DOMContentLoaded',function(){setTimeout(g,1500);},{once:true});}})();
</script>
</body>
</html>
